name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run rsync in dry-run mode (DreamHost)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
  DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
  DREAMHOST_REMOTE_PATH: ${{ secrets.DREAMHOST_REMOTE_PATH }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix admin

      - name: Fetch remote data caches
        run: |
          curl -s "https://adrian3.com/galleries/images-api.php" \
            | node -e "
              const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              d.folders=(d.folders||[]).filter(f=>!f.path.toLowerCase().includes('backup'));
              d.summary.folders=d.folders.length;
              d.summary.images=d.folders.reduce((n,f)=>n+f.count,0);
              d.summary.totalSize=d.folders.reduce((n,f)=>n+f.totalSize,0);
              require('fs').writeFileSync('admin/galleries.json',JSON.stringify(d,null,2));
              console.log('Galleries cached:',d.summary.folders,'folders,',d.summary.images,'images');
            "

      - name: Fetch Goodreads reading list
        run: |
          curl -s -A "Mozilla/5.0 (compatible; build-bot)" \
            "https://www.goodreads.com/review/list_rss/39560187?shelf=read&sort=date_read" \
            | node -e "
              const xml=require('fs').readFileSync('/dev/stdin','utf8');
              const items=xml.match(/<item>[\s\S]*?<\/item>/g)||[];
              const get=(s,t)=>{const m=s.match(new RegExp('<'+t+'>(?:<!\\\\[CDATA\\\\[([\\\\s\\\\S]*?)\\\\]\\\\]>|([^<]*?))<\\/'+t+'>'));return m?(m[1]!==undefined?m[1]:m[2]||'').trim():''};
              const books=items.map(i=>({title:get(i,'title'),author:get(i,'author_name'),cover:get(i,'book_large_image_url')||get(i,'book_medium_image_url'),rating:get(i,'user_rating'),dateRead:get(i,'user_read_at'),published:get(i,'book_published'),link:get(i,'link')}));
              require('fs').writeFileSync('admin/reading.json',JSON.stringify({synced:new Date().toISOString(),books},null,2));
              console.log('Reading list cached:',books.length,'books');
            "

      - name: Build site
        run: |
          node scripts/build.mjs
          test -s website/index.html
          test -s website/code/apps.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          force_orphan: true

      - name: Set up SSH key
        env:
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          rm -f ~/.ssh/id_* ~/.ssh/known_hosts ~/.ssh/config
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DREAMHOST_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DREAMHOST_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  IdentityAgent none\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Set rsync flags
        id: rsync_flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "flags=-az --dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "flags=-az" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to DreamHost via rsync
        env:
          SSH_AUTH_SOCK: ""
        run: |
          rsync ${{ steps.rsync_flags.outputs.flags }} \
            --verbose \
            --stats \
            --exclude='.DS_Store' \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no" \
            website/ \
            "$DREAMHOST_USER@$DREAMHOST_HOST:$DREAMHOST_REMOTE_PATH"
