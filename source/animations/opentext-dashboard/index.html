<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Observability dashboard animation</title>
  <link rel="stylesheet" href="../shared/embed.css">
</head>
<body>
  <div class="scene" role="img" aria-label="Observability dashboard panels floating above a silver laptop" aria-describedby="motion-status">
    <img class="poster" src="poster.webp" width="1200" height="750" alt="" fetchpriority="high">
  </div>
  <button class="motion-toggle" type="button" hidden>Pause animation</button>
  <span id="motion-status" class="sr-only" role="status"></span>
  <script type="module" src="../shared/embed.js"></script>
</body>
</html>
