<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Template Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Vollkorn:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    *:not(dialog) { margin: 0; }

    :root {
      color-scheme: light;
      --primary: #cc3300;
      --primary-focus: #a32900;
      --canvas: #ffffff;
      --parchment: #fafafa;
      --ink: #1d1d1f;
      --muted: #555555;
      --muted-soft: #7a7a7a;
      --hairline: #e0e0e0;
      --divider: #f0f0f0;
      --radius: 4px;
      --font-display: "Vollkorn", Georgia, serif;
      --font-ui: "Montserrat", Arial, sans-serif;
    }

    html { font-size: 100%; }

    body {
      min-height: 100vh;
      background: var(--parchment);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 0.875rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    .shell {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 1px;
      background: var(--hairline);
    }

    /* ── Panels ── */
    .panel {
      background: var(--canvas);
      padding: 1.5rem;
    }

    .panel + .panel {
      border-top: 0;
    }

    /* ── Hero strip ── */
    .hero-copy {
      display: grid;
      gap: 1rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, .button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      border-radius: var(--radius);
      padding: 0 1.375rem;
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
    }

    button:active, .button:active { transform: scale(0.97); }

    button:focus-visible, .button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    .button-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .button-primary:hover { background: var(--primary-focus); border-color: var(--primary-focus); }

    .button-secondary {
      background: var(--canvas);
      color: var(--ink);
      border-color: var(--hairline);
    }

    .button-secondary:hover { border-color: #c0c0c0; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--hairline);
      padding: 0;
    }

    .stat {
      background: var(--parchment);
      padding: 1.25rem 1.5rem;
    }

    .stat .label {
      display: block;
      color: var(--muted-soft);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .stat strong {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ink);
    }

    /* ── Section ── */
    .section {
      display: grid;
      gap: 1.25rem;
    }

    h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.2;
    }

    h3 {
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-soft);
    }

    /* ── Catalog ── */
    .catalog {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--hairline);
    }

    .catalog-group {
      background: var(--parchment);
      padding: 1.25rem;
      display: grid;
      gap: 0.75rem;
      align-content: start;
    }

    .catalog-group--wide {
      grid-column: span 2;
    }

    .catalog-group ul {
      list-style: none;
      padding: 0;
      display: grid;
      gap: 4px;
    }

    .catalog-group li {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--muted);
      word-break: break-word;
    }

    .catalog-group li strong {
      color: var(--ink);
      font-weight: 600;
    }

    .catalog-pairs {
      display: grid;
      gap: 6px;
    }

    .catalog-pair--header {
      padding-bottom: 6px;
      border-bottom: 1px solid var(--hairline);
      color: var(--muted-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }

    .catalog-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.75rem;
      align-items: start;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .catalog-pair__key,
    .catalog-pair__value {
      min-width: 0;
      word-break: break-word;
    }

    .catalog-pair__key {
      color: var(--ink);
      font-weight: 600;
    }

    .catalog-pair__value a {
      color: inherit;
    }

    .page-source {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .page-source__text {
      min-width: 0;
      word-break: break-word;
    }

    .warning-button {
      appearance: none;
      border: 1px solid #e5b000;
      background: #fff7d6;
      color: #6b5300;
      border-radius: 999px;
      min-height: 1.75rem;
      padding: 0 0.625rem;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .warning-button:hover {
      background: #ffefb3;
    }

    .warning-button[hidden] {
      display: none;
    }

    dialog.link-modal {
      width: min(960px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 0;
      background: var(--canvas);
      color: var(--ink);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.16);
    }

    dialog.link-modal::backdrop {
      background: rgba(29, 29, 31, 0.45);
    }

    .link-modal__shell {
      display: grid;
      gap: 1px;
      background: var(--hairline);
    }

    .link-modal__section {
      background: var(--canvas);
      padding: 1rem 1.25rem;
    }

    .link-modal__header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 1rem;
    }

    .link-modal__meta {
      display: grid;
      gap: 0.25rem;
    }

    .link-modal__meta p {
      color: var(--muted);
      font-size: 0.8125rem;
    }

    .link-modal__close {
      padding: 0 1rem;
    }

    .link-modal__empty {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .link-list {
      display: grid;
      gap: 1px;
      background: var(--hairline);
    }

    .link-item {
      display: grid;
      gap: 0.75rem;
      background: var(--parchment);
      padding: 1rem;
    }

    .link-item__meta {
      display: grid;
      gap: 0.375rem;
    }

    .link-item__eyebrow {
      color: var(--muted-soft);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .link-item__path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      word-break: break-word;
    }

    .link-item__controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: end;
    }

    .link-item__choice-list {
      display: grid;
      gap: 0.625rem;
    }

    .link-item__choice {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.625rem;
      align-items: start;
      padding: 0.75rem;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      background: var(--canvas);
      cursor: pointer;
    }

    .link-item__choice input {
      appearance: auto;
      width: 1rem;
      min-height: 1rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      accent-color: var(--primary);
      margin-top: 0.2rem;
    }

    .link-item__choice-text,
    .link-item__single-choice {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      color: var(--ink);
      word-break: break-word;
      text-transform: none;
    }

    .link-item__single-choice {
      padding: 0.75rem;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      background: var(--canvas);
    }

    .link-item__manual {
      display: grid;
      gap: 0.375rem;
    }

    .link-item__manual-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
    }

    .link-item__status {
      color: var(--muted-soft);
      font-size: 0.8125rem;
    }

    .catalog-subgroup {
      display: grid;
      gap: 0.5rem;
    }

    .catalog-subgroup + .catalog-subgroup {
      padding-top: 0.5rem;
      border-top: 1px solid var(--hairline);
    }

    .catalog-subgroup h4 {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-soft);
    }

    /* ── Settings form ── */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-start;
      justify-content: space-between;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input {
      appearance: none;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 0.6875rem 0.875rem;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 0.875rem;
      line-height: 1.2;
    }

    input:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
      border-color: var(--primary-focus);
    }

    /* ── Utility text ── */
    .status {
      color: var(--muted-soft);
      font-size: 0.8125rem;
    }

    .hint {
      font-size: 0.8125rem;
      color: var(--muted-soft);
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .field-grid, .stats, .catalog { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel hero-copy">
      <h1>Markdown Template Engine</h1>
      <div class="actions">
        <button class="button-primary" id="buildButton">Build site</button>
      </div>
      <div class="status" id="status">Loading project data...</div>
    </section>
    <section class="panel stats" id="stats">
      <div class="stat">
        <span class="label">Generated pages</span>
        <strong id="pageCount">0</strong>
      </div>
      <div class="stat">
        <span class="label">Preview URL</span>
        <strong><a id="previewUrlText" href="#" target="_blank" rel="noreferrer">preview</a></strong>
      </div>
      <div class="stat">
        <span class="label">On your network</span>
        <strong><a id="networkUrlText" href="#" target="_blank" rel="noreferrer">—</a></strong>
      </div>
    </section>
    <section class="panel section">
      <div class="catalog">
        <div class="catalog-group">
          <h3>Variables</h3>
          <div class="catalog-pairs" id="variablesList"></div>
        </div>
        <div class="catalog-group">
          <h3>Frontmatter</h3>
          <div class="catalog-subgroup">
            <h4>System keys</h4>
            <ul id="frontmatterSystemKeysList"></ul>
          </div>
          <div class="catalog-subgroup">
            <h4>User-defined keys</h4>
            <ul id="frontmatterUserKeysList"></ul>
          </div>
        </div>
        <div class="catalog-group">
          <h3>Components</h3>
          <div class="catalog-pairs" id="componentsList"></div>
        </div>
        <div class="catalog-group">
          <h3>Templates</h3>
          <ul id="templatesList"></ul>
        </div>
        <div class="catalog-group catalog-group--wide">
          <h3>Pages</h3>
          <div class="catalog-pairs" id="pagesList"></div>
        </div>
      </div>
    </section>
  </main>
  <dialog class="link-modal" id="linkModal">
    <div class="link-modal__shell">
      <div class="link-modal__section link-modal__header">
        <div class="link-modal__meta">
          <h2 id="linkModalTitle">Broken links</h2>
          <p id="linkModalSubtitle">Checking source file…</p>
        </div>
        <button type="button" class="button-secondary link-modal__close" id="linkModalClose">Close</button>
      </div>
      <div class="link-modal__section">
        <div class="link-list" id="linkModalList"></div>
      </div>
    </div>
  </dialog>

  <script type="module">
    const previewPort = Number(window.location.port || "3002") + 1;
    const previewOrigin = `${window.location.protocol}//${window.location.hostname}:${previewPort}`;

    const status = document.getElementById("status");
    const pageCount = document.getElementById("pageCount");
    const buildButton = document.getElementById("buildButton");
    const previewUrlText = document.getElementById("previewUrlText");
    const networkUrlText = document.getElementById("networkUrlText");
    const templatesList = document.getElementById("templatesList");
    const componentsList = document.getElementById("componentsList");
    const pagesList = document.getElementById("pagesList");
    const variablesList = document.getElementById("variablesList");
    const frontmatterSystemKeysList = document.getElementById("frontmatterSystemKeysList");
    const frontmatterUserKeysList = document.getElementById("frontmatterUserKeysList");
    const linkModal = document.getElementById("linkModal");
    const linkModalTitle = document.getElementById("linkModalTitle");
    const linkModalSubtitle = document.getElementById("linkModalSubtitle");
    const linkModalList = document.getElementById("linkModalList");
    const linkModalClose = document.getElementById("linkModalClose");

    let catalogState = null;
    let linkReportBySource = new Map();
    let activeModalSource = null;

    function setStatus(message) {
      status.textContent = message;
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const text = await response.text();
      let data = text;
      try { data = text ? JSON.parse(text) : {}; } catch {}
      if (!response.ok) {
        throw new Error(data.error || response.statusText);
      }
      return data;
    }

    function updateStats(posts) {
      pageCount.textContent = String(posts?.posts?.length ?? 0);
    }

    function renderCategoryList(listNode, items) {
      listNode.innerHTML = "";
      if (!items.length) {
        const li = document.createElement("li");
        li.textContent = "None";
        listNode.appendChild(li);
        return;
      }

      for (const item of items) {
        const li = document.createElement("li");
        if (typeof item === "string") {
          li.textContent = item.replace(/^(components|templates|pages)\//, "");
        } else {
          const strong = document.createElement("strong");
          strong.textContent = item.shortcode;
          li.appendChild(strong);
          li.appendChild(document.createTextNode(` = ${item.value}`));
        }
        listNode.appendChild(li);
      }
    }

    function renderPairTable(listNode, items, columns, options = {}) {
      listNode.innerHTML = "";

      const header = document.createElement("div");
      header.className = "catalog-pair catalog-pair--header";
      for (const column of columns) {
        const cell = document.createElement("div");
        cell.className = column.className || "";
        cell.textContent = column.label;
        header.appendChild(cell);
      }
      listNode.appendChild(header);

      if (!items.length) {
        const row = document.createElement("div");
        row.className = "catalog-pair";
        const key = document.createElement("div");
        key.className = "catalog-pair__key";
        key.textContent = "None";
        row.appendChild(key);
        listNode.appendChild(row);
        return;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "catalog-pair";
        for (const column of columns) {
          const cell = document.createElement("div");
          if (column.className) cell.className = column.className;
          if (column.render) {
            column.render(cell, item, options);
          } else {
            cell.textContent = String(item?.[column.field] ?? "");
          }
          row.appendChild(cell);
        }
        listNode.appendChild(row);
      }
    }

    function getLinkEntry(source) {
      return linkReportBySource.get(source) || { source, brokenCount: 0, brokenLinks: [] };
    }

    function buildPagesListItems() {
      const relPaths = catalogState?.pages || [];
      return relPaths.map(relPath => ({
        source: relPath.replace(/^pages\//, ""),
        url: "/" + relPath.replace(/\.(md|markdown)$/i, ".html").replace(/^pages\//, ""),
      }));
    }

    function renderPagesTable() {
      const items = buildPagesListItems();
      renderPairTable(pagesList, items, [
        {
          label: "Source",
          className: "catalog-pair__key",
          render(cell, item) {
            const wrap = document.createElement("div");
            wrap.className = "page-source";

            const entry = getLinkEntry(item.source);
            const warning = document.createElement("button");
            warning.type = "button";
            warning.className = "warning-button";
            warning.hidden = entry.brokenCount === 0;
            warning.textContent = `! ${entry.brokenCount}`;
            warning.setAttribute("aria-label", `${entry.brokenCount} broken internal ${entry.brokenCount === 1 ? "link" : "links"} in ${item.source}`);
            warning.addEventListener("click", () => openLinkModal(item.source));

            const text = document.createElement("div");
            text.className = "page-source__text";
            text.textContent = item.source;

            wrap.appendChild(warning);
            wrap.appendChild(text);
            cell.appendChild(wrap);
          },
        },
        {
          label: "Preview HTML",
          className: "catalog-pair__value",
          render(cell, item) {
            const link = document.createElement("a");
            link.href = `${previewOrigin}${item.url}`;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.textContent = item.url;
            cell.appendChild(link);
          },
        },
      ]);
    }

    function renderLinkModal(source) {
      const entry = getLinkEntry(source);
      linkModalTitle.textContent = source;
      linkModalSubtitle.textContent = entry.brokenCount === 0
        ? "No broken internal links detected."
        : `${entry.brokenCount} broken internal ${entry.brokenCount === 1 ? "link" : "links"} detected.`;

      linkModalList.innerHTML = "";
      if (!entry.brokenLinks.length) {
        const empty = document.createElement("div");
        empty.className = "link-modal__empty";
        empty.textContent = "This file does not currently have any broken internal links.";
        linkModalList.appendChild(empty);
        return;
      }

      for (const brokenLink of entry.brokenLinks) {
        const item = document.createElement("div");
        item.className = "link-item";

        const meta = document.createElement("div");
        meta.className = "link-item__meta";

        const eyebrow = document.createElement("div");
        eyebrow.className = "link-item__eyebrow";
        eyebrow.textContent = `${brokenLink.kind} link · line ${brokenLink.line}`;

        const pathNode = document.createElement("div");
        pathNode.className = "link-item__path";
        pathNode.textContent = brokenLink.href;

        meta.appendChild(eyebrow);
        meta.appendChild(pathNode);

        const controls = document.createElement("div");
        controls.className = "link-item__controls";

        const selectWrap = document.createElement("div");
        selectWrap.className = "field";

        const selectLabel = document.createElement("label");
        const candidateCount = brokenLink.candidates?.length || 0;
        selectLabel.textContent = candidateCount > 1
          ? `Suggested link (${candidateCount} matches)`
          : "Suggested link";

        const requiresChoice = candidateCount > 1;
        let selectedValue = requiresChoice
          ? ""
          : (brokenLink.candidates?.[0]?.replacementHref || "");
        let choiceList = null;

        const statusText = document.createElement("div");
        statusText.className = "link-item__status";
        statusText.textContent = "";

        selectWrap.appendChild(selectLabel);

        if (!candidateCount) {
          const empty = document.createElement("div");
          empty.className = "link-modal__empty";
          empty.textContent = "No suggested match";
          selectWrap.appendChild(empty);
        } else if (requiresChoice) {
          choiceList = document.createElement("div");
          choiceList.className = "link-item__choice-list";
          const radioName = `candidate-${source}-${brokenLink.id}`.replace(/[^a-zA-Z0-9_-]+/g, "-");

          for (const candidate of brokenLink.candidates) {
            const choiceLabel = document.createElement("label");
            choiceLabel.className = "link-item__choice";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = radioName;
            radio.value = candidate.replacementHref;
            radio.addEventListener("change", () => {
              selectedValue = radio.value;
              manualInput.value = "";
              syncSelectionState();
            });

            const choiceText = document.createElement("div");
            choiceText.className = "link-item__choice-text";
            choiceText.textContent = candidate.sitePath;

            choiceLabel.appendChild(radio);
            choiceLabel.appendChild(choiceText);
            choiceList.appendChild(choiceLabel);
          }

          selectWrap.appendChild(choiceList);
        } else {
          const singleChoice = document.createElement("div");
          singleChoice.className = "link-item__single-choice";
          singleChoice.textContent = brokenLink.candidates[0].sitePath;
          selectWrap.appendChild(singleChoice);
        }

        const manualWrap = document.createElement("div");
        manualWrap.className = "link-item__manual";

        const manualLabel = document.createElement("label");
        manualLabel.textContent = "Manual path";

        const manualInput = document.createElement("input");
        manualInput.type = "text";
        manualInput.className = "link-item__manual-input";
        manualInput.placeholder = "/gallery-pages/example.html";
        manualInput.autocomplete = "off";
        manualInput.spellcheck = false;
        manualInput.value = "";
        manualInput.addEventListener("input", () => {
          const manualValue = manualInput.value.trim();
          if (manualValue) {
            if (choiceList) {
              for (const radio of choiceList.querySelectorAll('input[type="radio"]')) {
                radio.checked = false;
              }
            }
            selectedValue = manualValue;
          } else if (candidateCount === 1) {
            selectedValue = brokenLink.candidates[0].replacementHref;
          } else if (choiceList) {
            const checked = choiceList.querySelector('input[type="radio"]:checked');
            selectedValue = checked ? checked.value : "";
          } else {
            selectedValue = "";
          }
          syncSelectionState();
        });

        manualWrap.appendChild(manualLabel);
        manualWrap.appendChild(manualInput);
        selectWrap.appendChild(manualWrap);
        selectWrap.appendChild(statusText);

        const updateButton = document.createElement("button");
        updateButton.type = "button";
        updateButton.className = "button-primary";
        updateButton.textContent = "Update link";
        updateButton.disabled = true;

        function syncSelectionState() {
          const manualValue = manualInput.value.trim();
          if (!manualValue && candidateCount === 0) {
            selectedValue = "";
          }

          statusText.textContent = selectedValue
            ? `Will update to ${selectedValue}`
            : candidateCount
              ? `${candidateCount} possible matches found. Choose one before updating.`
              : "";
          updateButton.disabled = !selectedValue;
        }

        updateButton.addEventListener("click", async () => {
          if (!selectedValue) return;
          updateButton.disabled = true;
          const previous = statusText.textContent;
          statusText.textContent = "Updating link...";
          try {
            const result = await request("/api/link-fix", {
              method: "POST",
              body: JSON.stringify({
                source,
                findingId: brokenLink.id,
                replacementHref: selectedValue,
                originalHref: brokenLink.href,
              }),
            });
            linkReportBySource.set(source, result.page);
            renderPagesTable();
            renderLinkModal(source);
            setStatus(`Updated link in ${source}.`);
          } catch (error) {
            statusText.textContent = previous;
            setStatus(error.message);
          } finally {
            updateButton.disabled = false;
          }
        });

        syncSelectionState();

        controls.appendChild(selectWrap);
        controls.appendChild(updateButton);

        item.appendChild(meta);
        item.appendChild(controls);
        linkModalList.appendChild(item);
      }
    }

    function openLinkModal(source) {
      activeModalSource = source;
      renderLinkModal(source);
      linkModal.showModal();
    }

    function closeLinkModal() {
      linkModal.close();
      activeModalSource = null;
    }

    async function loadCatalog() {
      const catalog = await request("/api/catalog");
      catalogState = catalog;
      renderCategoryList(templatesList, catalog.templates || []);
      renderPairTable(componentsList, catalog.components || [], [
        { label: "Component name", field: "name", className: "catalog-pair__key" },
        { label: "Shortcode", field: "shortcode", className: "catalog-pair__value" },
      ]);
      renderPairTable(variablesList, catalog.variables || [], [
        { label: "Key", field: "key", className: "catalog-pair__key" },
        { label: "Value", field: "value", className: "catalog-pair__value" },
      ]);
      renderPagesTable();
      renderCategoryList(frontmatterSystemKeysList, catalog.frontmatterSystemKeys || []);
      renderCategoryList(frontmatterUserKeysList, catalog.frontmatterUserKeys || []);
    }

    async function loadLinkReport() {
      const report = await request("/api/link-report");
      linkReportBySource = new Map((report.pages || []).map(page => [page.source, page]));
      renderPagesTable();
      if (activeModalSource) renderLinkModal(activeModalSource);
    }

    async function loadPosts() {
      try {
        const posts = await request("/api/posts");
        window.__posts = posts;
        updateStats(posts);
      } catch {
        window.__posts = { posts: [] };
      }
    }

    async function loadAll() {
      setStatus("Loading project data...");
      previewUrlText.href = `${previewOrigin}/`;
      previewUrlText.textContent = previewOrigin.replace(/^https?:\/\//, "") + "/";
      const network = await request("/api/network").catch(() => ({}));
      if (network.url) {
        networkUrlText.href = network.url;
        networkUrlText.textContent = network.url.replace(/^https?:\/\//, "");
      }
      await Promise.all([loadPosts(), loadCatalog(), loadLinkReport()]);
      setStatus("Ready.");
    }

    async function buildSite() {
      setStatus("Building...");
      await request("/api/build", { method: "POST", body: "{}" });
      setStatus("Build complete.");
      await Promise.all([loadPosts(), loadCatalog(), loadLinkReport()]);
    }

    buildButton.addEventListener("click", async () => {
      try { await buildSite(); } catch (error) { setStatus(error.message); }
    });

    linkModalClose.addEventListener("click", closeLinkModal);
    linkModal.addEventListener("click", event => {
      const rect = linkModal.getBoundingClientRect();
      const isBackdrop = (
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom
      );
      if (isBackdrop) closeLinkModal();
    });

    await loadAll();
  </script>
</body>
</html>
